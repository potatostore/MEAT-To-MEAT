# 고기서고기 로컬 실행 환경
#   DB만:        docker compose up -d
#   전체(DB+백엔드+프론트): docker compose --profile full up -d --build
#   모니터링 추가:          docker compose --profile full --profile monitoring up -d --build
#   부하 테스트(k6):        docker compose --profile loadtest run --rm k6 run /scripts/products.js
#   NL2SQL(자연어 → SQL):   docker compose --profile nl2sql up -d --build   (API: http://localhost:8000/docs)
#   NL2SQL 관리자 화면:    docker compose --profile full --profile nl2sql up -d --build → http://localhost:3000/admin/ask
#   NL2SQL 평가:            docker compose --profile nl2sql run --rm nl2sql python evaluate.py
#   자세한 설명: monitoring/README.md
services:
  mysql:
    image: mysql:8.4
    container_name: m2m-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: meat_to_meat
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      # 슬로우 쿼리 로그: 0.1초 이상 걸린 쿼리를 /var/lib/mysql/slow.log 에 남긴다 (Alloy 가 읽어서 Loki 로 보냄)
      - --slow-query-log=ON
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=0.1
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro   # 볼륨이 비어 있을 때(최초 1회)만 실행
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    profiles: ["full"]
    build: ./backend/m2m-shoppingmall-api
    container_name: m2m-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/meat_to_meat?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SHOW_SQL: "false"   # SQL 로그가 부하 테스트 결과와 Loki 를 덮지 않도록 끈다
      TZ: Asia/Seoul
    ports:
      - "8080:8080"

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_MOCK: ${NEXT_PUBLIC_API_MOCK:-false}
        API_BASE_URL: http://backend:8080
        NL2SQL_BASE_URL: http://nl2sql:8000   # 관리자 페이지 /admin/ask → NL2SQL 서비스
    container_name: m2m-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8080   # 서버 컴포넌트가 컨테이너 네트워크로 백엔드 호출
    ports:
      - "3000:3000"

  # ===================== NL2SQL (--profile nl2sql) =====================
  # 자연어 질문 → LLM이 SQL 생성 → nl2sql_reader(SELECT 전용) 계정으로 실행
  # 테이블은 백엔드(Flyway)가 만들기 때문에 백엔드를 한 번은 띄운 뒤 사용한다
  nl2sql:
    profiles: ["nl2sql"]
    build: ./nl2sql
    container_name: m2m-nl2sql
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NL2SQL_DB_HOST: mysql
      NL2SQL_DB_PORT: "3306"
      NL2SQL_DB_USER: nl2sql_reader
      NL2SQL_DB_PASSWORD: ${NL2SQL_READER_PASSWORD:-reader_pw_change_me}
      NL2SQL_PROVIDER: ${NL2SQL_PROVIDER:-groq}
      NL2SQL_MODEL: ${NL2SQL_MODEL:-}
      NL2SQL_TODAY: ${NL2SQL_TODAY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # /admin/ask 에서 쓸 수 있는 회원 아이디(쉼표 구분). 토큰은 백엔드 /members/me 로 확인한다
      NL2SQL_ADMIN_LOGIN_IDS: ${NL2SQL_ADMIN_LOGIN_IDS:-meatlover}
      NL2SQL_BACKEND_URL: http://backend:8080
      TZ: Asia/Seoul
    volumes:
      - ./nl2sql/results:/app/results     # 평가 결과 CSV가 호스트의 nl2sql/results 에 저장됨
    ports:
      - "127.0.0.1:8000:8000"             # 관리자 기능이라 내 PC에서만 접속 가능하게

  # ===================== 모니터링 (--profile monitoring) =====================
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    container_name: m2m-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver   # k6 가 결과를 밀어넣을 수 있게 허용
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 맥에서 직접 띄운 백엔드도 수집
    ports:
      - "9090:9090"

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.5.3
    container_name: m2m-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  alloy:
    profiles: ["monitoring"]
    image: grafana/alloy:v1.10.1
    container_name: m2m-alloy
    restart: unless-stopped
    command: run /etc/alloy/config.alloy --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # 컨테이너 로그 읽기
      - mysql-data:/mysql-data:ro                       # MySQL 슬로우 쿼리 로그 읽기
    depends_on:
      - loki
    ports:
      - "12345:12345"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.1
    container_name: m2m-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # 로컬 과제용: 로그인 없이 대시보드 보기
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/meat-to-meat.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "3001:3000"   # 프론트가 3000 을 쓰므로 3001

  # ===================== 부하 테스트 (--profile loadtest) =====================
  k6:
    profiles: ["loadtest"]
    image: grafana/k6:1.2.2
    container_name: m2m-k6
    volumes:
      - ./loadtest/k6:/scripts:ro
    environment:
      BASE_URL: http://backend:8080
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99),avg,max"
      K6_OUT: experimental-prometheus-rw   # 결과를 Prometheus 로 보내 Grafana 에서 보이게 한다
    entrypoint: ["k6"]

volumes:
  mysql-data:
  prometheus-data:
  loki-data:
  grafana-data:

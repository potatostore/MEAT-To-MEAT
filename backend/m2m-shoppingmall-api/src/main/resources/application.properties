spring.application.name=shoppingmall-api

# MySQL - 각자 로컬 환경에 맞게 환경변수(DB_URL, DB_USERNAME, DB_PASSWORD)로 덮어쓰기
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/meat_to_meat?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 1. 도커 MySQL 접속 설정 (.env 파일과 동일하게 맞춤)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/meat_to_meat?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=m2m_user
spring.datasource.password=m2m_pass123!

# 2. JPA 및 스키마 자동 업데이트 설정 (LocalContainerEntityManagerFactoryBean 에러 방지)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Flyway가 켜져 있어서 스키마 충돌이 난다면 로컬 테스트 시 잠시 비활성화
spring.flyway.enabled=false

spring.jpa.open-in-view=false
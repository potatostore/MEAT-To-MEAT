# Grafana 가 시작할 때 데이터 소스를 자동 등록한다 (UI 에서 수동 등록할 필요 없음)
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
